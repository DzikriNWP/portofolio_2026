<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favicon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Rounded Badge -->
  <rect width="64" height="64" rx="16" fill="url(#favicon-gradient)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Monogram "DN" Typography -->
  <text 
    x="32" 
    y="40" 
    font-family="system-ui, -apple-system, 'Inter', 'Geist Mono', sans-serif" 
    font-size="26" 
    font-weight="800" 
    fill="#FFFFFF" 
    text-anchor="middle" 
    letter-spacing="-0.5px"
    filter="url(#subtle-shadow)"
  >
    DN
  </text>

  <!-- Small Emerald Dot (Active / Available status indicator) -->
  <circle cx="49" cy="15" r="4" fill="#10B981" stroke="#4338CA" stroke-width="1.5" />
</svg>